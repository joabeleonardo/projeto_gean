<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Preços - Estacionamento</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/formularios.css">
</head>
<body>
    <div class="container">
        
        <!-- MENU LATERAL (Navegação) -->
        <aside class="sidebar">
            <h2>Estacionamento</h2>
            <nav>
                <ul>
                    <!-- O atributo href aponta para o nome exato do arquivo HTML -->
                    <li><a href="index.html" id="link-painel">Painel (Dashboard)</a></li>
                    <li><a href="movimentacao.html" id="link-movimentacao">Movimentação</a></li>
                    <li><a href="clientes.html" id="link-clientes">Clientes</a></li>
                    <li><a href="veiculos.html" id="link-veiculos">Veículos</a></li>
                    <li><a href="vagas.html" id="link-vagas">Vagas</a></li>
                    <!-- A classe "ativo" acende este item no menu -->
                    <li><a href="precos.html" id="link-precos" class="ativo">Preços</a></li>
                    <li><a href="pagamentos.html" id="link-pagamentos">Pagamentos</a></li>
                </ul>
            </nav>
        </aside>
        
        <!-- Área Central de Conteúdo -->
        <main class="conteudo">
            <header>
                <h1>Configuração de Preços</h1>
                <span>Logado como: Admin Sistema</span>
            </header>
            
            <!-- Formulário de Cadastro -->
            <section class="formulario-box">
                <form id="form-preco">
                    <div class="input-group">
                        <label for="tipo_cobranca">Tipo de Cobrança:</label>
                        <select id="tipo_cobranca" required>
                            <option value="Mensalista">Mensalista (Valor Mensal)</option>
                            <option value="Horista">Horista (Valor por Hora)</option>
                        </select>
                    </div>
                    
                    <div class="input-group">
                        <label for="valor">Valor (R$):</label>
                        <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 15.50" required>
                    </div>

                    <button type="submit" class="btn-salvar">Salvar Preço</button>
                </form>
            </section>

            <!-- Tabela de Listagem -->
            <section class="tabela-box">
                <h2>Preços Cadastrados</h2>
                <table id="tabela-precos">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tipo de Cobrança</th>
                            <th>Valor (R$)</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- As linhas dos preços serão inseridas aqui via JavaScript -->
                    </tbody>
                </table>
            </section>

        </main>
    </div>

    <!-- Script de integração com a API -->
    <script src="../js/precos.js"></script>
</body>
</html>
