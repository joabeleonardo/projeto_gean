<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inadimplência · Estacionamento</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app">
    <aside class="menu" id="menu"></aside>
    <main class="conteudo">
        <header class="topo" id="topo"></header>
        <section class="painel">
            <div class="painel-cab"><h2>Clientes inadimplentes</h2><span class="ajuda" id="resumo-inad"></span></div>
            <p class="ajuda" style="margin-bottom:10px">Inadimplente é o cliente com cobrança vencida e não paga. A entrada dele fica bloqueada; só um administrador libera, com o código de liberação.</p>
            <div class="fila-filtros">
                <div class="campo"><label for="f-nome">Nome</label><input id="f-nome" type="search" autocomplete="off" placeholder="Parte do nome"></div>
                <div class="campo"><label for="f-doc">CPF / CNPJ</label><input id="f-doc" type="search" autocomplete="off" placeholder="Só números"></div>
                <div class="campo"><button class="btn sec" id="btn-limpar" type="button" data-dica="Apagar os filtros">Limpar filtros</button></div>
            </div>
            <div class="tabela-rolagem"><table>
                <thead><tr><th>Cliente</th><th>Documento</th><th>Contato</th><th class="num">Dias em atraso</th><th class="num">Em aberto</th><th></th></tr></thead>
                <tbody id="tbody"></tbody>
            </table></div>
            <div id="paginador"></div>
        </section>
    </main>
</div>
<script src="../js/app.js"></script>
<script src="../js/operacao.js"></script>
<script src="../js/inadimplencia.js"></script>
</body>
</html>
