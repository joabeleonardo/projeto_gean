<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes · Estacionamento</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app">
    <aside class="menu" id="menu"></aside>
    <main class="conteudo">
        <header class="topo" id="topo"></header>
        <section class="painel">
            <div class="painel-cab"><h2>Filtros</h2><a class="btn" href="cadastro.html" data-dica="Abrir o cadastro completo de um novo cliente">Novo cliente</a></div>
            <div class="fila-filtros">
                <div class="campo"><label for="f-nome">Nome</label><input id="f-nome" type="search" autocomplete="off" placeholder="Parte do nome"></div>
                <div class="campo"><label for="f-doc">CPF / CNPJ / documento</label><input id="f-doc" type="search" autocomplete="off" placeholder="Só números"></div>
                <div class="campo"><label for="f-tel">Telefone</label><input id="f-tel" type="search" autocomplete="off" placeholder="Parte do número"></div>
                <div class="campo"><label for="f-placa">Placa</label><input id="f-placa" type="search" autocomplete="off" placeholder="ABC-1234"></div>
                <div class="campo"><label for="f-tipo">Mostrar</label>
                    <select id="f-tipo"><option value="">Todos os clientes</option><option value="mensalista">Só mensalistas</option><option value="premium">Só premium</option><option value="horista">Só horistas</option><option value="inadimplente">Só inadimplentes</option></select></div>
                <div class="campo"><label for="f-pais">Origem</label>
                    <select id="f-pais"><option value="">Brasil e exterior</option><option value="brasil">Só do Brasil</option><option value="estrangeiro">Só estrangeiros</option></select></div>
                <div class="campo"><label for="f-ordem">Ordenar por</label>
                    <select id="f-ordem"><option value="nome">Nome</option><option value="documento">Documento</option><option value="recentes">Cadastro mais recente</option></select></div>
                <div class="campo"><button class="btn sec" id="btn-limpar" type="button" data-dica="Apagar todos os filtros">Limpar filtros</button></div>
            </div>
        </section>
        <section class="painel">
            <div class="tabela-rolagem"><table>
                <thead><tr><th>Nome</th><th>Documento</th><th>Contato</th><th>Plano</th><th></th></tr></thead>
                <tbody id="tbody"></tbody>
            </table></div>
            <div id="paginador"></div>
        </section>
    </main>
</div>
<script src="../js/app.js"></script>
<script src="../js/clientes.js"></script>
</body>
</html>
